# Render Blueprint: статический сайт без сервера, бесплатный тариф не засыпает
services:
  - type: web
    name: npz-evacuation-prototype
    runtime: static
    buildCommand: node build.js
    staticPublishPath: ./public
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
